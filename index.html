<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdownreview</title>
    <!--
      FOUC mitigation (issue #265). The inline <script> below MUST stay
      synchronous (no defer/async) — it sets [data-theme] on <html> from
      localStorage BEFORE the React module script executes, so app.css's
      [data-theme]-keyed rules paint the right theme on first frame.

      No inline <style> is allowed in this file — it would trigger
      Tauri's runtime CSP nonce-injection on style-src and disable
      'unsafe-inline' for every other inline-style consumer (Shiki,
      KaTeX, Mermaid, React style props). See `docs/security.md` rule
      17a for the full rationale and `src/__tests__/index-html-no-inline-style.test.ts`
      for the regression guard.
    -->
    <script>
      try {
        var raw = localStorage.getItem("mdownreview-ui");
        var resolved = "dark";
        if (raw) {
          var parsed = JSON.parse(raw);
          var theme = parsed && parsed.state ? parsed.state.theme : null;
          if (theme === "light" || theme === "dark") {
            resolved = theme;
          } else {
            // theme === "system" or unknown — defer to OS preference
            resolved =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
        } else {
          resolved =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (_e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
