name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Workflow-level default is read-only. The deploy job below opts in to
# pages: write + id-token: write — narrowing OIDC token scope to the
# only job that needs it (sec-token-default-read-only).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Preserve canary-latest.json across pages.yml deploys.
      #
      # The canary updater manifest is published to Pages by canary.yml (not
      # tracked in main). If pages.yml deployed site/ as-tracked, every
      # docs/site update would wipe the canary manifest from Pages, breaking
      # auto-update for every canary client until the next push to main.
      #
      # Fetching the live manifest from Pages before each deploy makes the
      # current Pages deployment the single source of truth — both
      # canary.yml and pages.yml preserve it across their respective
      # deploys. First-ever deploy is a no-op (404 from curl → skip).
      - name: Preserve canary-latest.json from current Pages deployment
        run: |
          set -e
          mkdir -p site
          if curl -fsSL "https://dryotta.github.io/mdownreview/canary-latest.json" \
              -o site/canary-latest.json; then
            echo "Preserved canary-latest.json ($(wc -c < site/canary-latest.json) bytes)"
          else
            echo "No live canary-latest.json on Pages yet — first deploy?"
            rm -f site/canary-latest.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

