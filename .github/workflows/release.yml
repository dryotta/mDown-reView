name: Release

# Tag-triggered release workflow. Delegates build + signing + verification to
# ci.yml via workflow_call (sign=true, profile=release). Wrapper workflow
# only handles release-creation, asset renaming, manifest publication, and
# undraft. If CI passes, this workflow cannot fail downstream — every
# canary/release-specific check (DMG layout, ad-hoc sig, updater asset
# presence) lives inside ci.yml itself.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.2)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Named static group so release publishes serialize. Never cancel an
  # in-progress release — half-published GitHub releases are user-visible.
  group: release-publish
  cancel-in-progress: false

jobs:
  # ── Resolve tag (env-var indirected to avoid script injection) ──────────
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Validate + emit tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Refusing to release tag '$TAG' — expected vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Create draft release ────────────────────────────────────────────────
  create-release:
    name: Create draft release
    needs: resolve-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          gh release view "$TAG" &>/dev/null && exit 0
          gh release create "$TAG" \
            --draft \
            --title "mdownreview $TAG" \
            --notes "## Install

          ### Script install (recommended)

          **macOS**
          \`\`\`
          curl -LsSf https://dryotta.github.io/mdownreview/install.sh | sh
          \`\`\`

          **Windows (PowerShell)**
          \`\`\`
          powershell -ExecutionPolicy ByPass -c \"irm https://dryotta.github.io/mdownreview/install.ps1 | iex\"
          \`\`\`

          > ⚠️ Pipes remote code into your shell — use the manual download below if blocked by security policy.

          ### Manual download

          Grab the installer for your platform from the Assets section below.

          **macOS only** — because the app is ad-hoc signed (not notarized), clear the quarantine attribute after first launch is blocked:
          \`\`\`
          xattr -dr com.apple.quarantine /Applications/mdownreview.app
          \`\`\`

          ### CLI only (Cargo)

          \`\`\`
          cargo install --git https://github.com/dryotta/mdownreview.git --bin mdownreview-cli
          \`\`\`

          ### Why is the app unsigned?

          See [docs/features/installation.md](https://github.com/dryotta/mdownreview/blob/main/docs/features/installation.md) for the rationale and security trade-offs."

  # ── Delegate build + verify to ci.yml ───────────────────────────────────
  ci:
    name: CI (signed, release profile)
    needs: resolve-tag
    # `ci-gate-inputs` inside ci.yml declares per-job `actions: read` +
    # `pull-requests: read` (needed only on push-to-main for the squash-merge
    # tree-hash skip path). When ci.yml is invoked via workflow_call, the
    # called workflow's per-job permissions cannot exceed those of the
    # calling job — so we must grant these scopes here even though the skip
    # path is a no-op on workflow_call. Mirrors the same block in canary.yml.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-tag.outputs.tag }}
      profile: release
      sign: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # ── Rename + upload artefacts to the GitHub release ─────────────────────
  upload-assets:
    name: Upload assets
    needs: [resolve-tag, create-release, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts/

      - name: List downloaded artefacts
        run: ls -la artefacts/ artefacts/*/

      - name: Rename + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh release upload` needs the repo context. This job has no
          # `actions/checkout` step (we only download artefacts), so `gh`
          # cannot infer the repo from `git remote`. Set it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -e
          VERSION="${TAG#v}"
          for plat in windows-x64 windows-arm64 macos-arm64; do
            base="mdownreview-${VERSION}-${plat}"
            indir="artefacts/${plat}"
            [ -d "$indir" ] || { echo "::error::Missing artefact dir for $plat"; exit 1; }
            case "$plat" in
              windows-*)
                cp "${indir}/mdownreview-${plat}.zip" "${base}.zip"
                gh release upload "$TAG" "${base}.zip" --clobber
                if [ -s "${indir}/mdownreview-${plat}.zip.sig" ]; then
                  cp "${indir}/mdownreview-${plat}.zip.sig" "${base}.zip.sig"
                  gh release upload "$TAG" "${base}.zip.sig" --clobber
                else
                  echo "::error::Missing .sig for $plat"; exit 1
                fi
                ;;
              macos-*)
                cp "${indir}/mdownreview-${plat}.dmg" "${base}.dmg"
                gh release upload "$TAG" "${base}.dmg" --clobber
                cp "${indir}/mdownreview-${plat}.app.tar.gz" "${base}.app.tar.gz"
                gh release upload "$TAG" "${base}.app.tar.gz" --clobber
                if [ -s "${indir}/mdownreview-${plat}.app.tar.gz.sig" ]; then
                  cp "${indir}/mdownreview-${plat}.app.tar.gz.sig" "${base}.app.tar.gz.sig"
                  gh release upload "$TAG" "${base}.app.tar.gz.sig" --clobber
                else
                  echo "::error::Missing .sig for $plat updater"; exit 1
                fi
                ;;
            esac
          done

  # ── Publish updater manifest ────────────────────────────────────────────
  publish-update-manifest:
    name: Publish update manifest
    needs: [resolve-tag, upload-assets]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Build + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `actions/checkout` in this job → set repo context for `gh`
          # release download / view / upload.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -e
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/dryotta/mdownreview/releases/download/${TAG}"
          NAME="mdownreview-${VERSION}"
          mkdir -p /tmp/sigs
          read_sig() {
            local asset_name="$1"
            gh release download "$TAG" --pattern "${asset_name}" --dir /tmp/sigs 2>/dev/null || true
            local content
            content=$(cat "/tmp/sigs/${asset_name}" 2>/dev/null || echo "")
            if [ -z "$content" ]; then
              echo "::error::Missing or empty signature: $asset_name"
              return 1
            fi
            echo "$content"
          }
          for asset in "${NAME}-windows-x64.zip" "${NAME}-windows-arm64.zip" "${NAME}-macos-arm64.app.tar.gz"; do
            gh release view "$TAG" --json assets --jq ".assets[].name" | grep -q "^${asset}$" || \
              { echo "::error::Required updater asset not found: $asset"; exit 1; }
          done
          WIN_X64_SIG=$(read_sig "${NAME}-windows-x64.zip.sig")
          WIN_ARM64_SIG=$(read_sig "${NAME}-windows-arm64.zip.sig")
          MAC_ARM64_SIG=$(read_sig "${NAME}-macos-arm64.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes on GitHub.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_X64_SIG}",
                "url": "${BASE_URL}/${NAME}-windows-x64.zip"
              },
              "windows-aarch64": {
                "signature": "${WIN_ARM64_SIG}",
                "url": "${BASE_URL}/${NAME}-windows-arm64.zip"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM64_SIG}",
                "url": "${BASE_URL}/${NAME}-macos-arm64.app.tar.gz"
              }
            }
          }
          EOF
          gh release upload "$TAG" /tmp/latest.json --clobber

  # ── Undraft ─────────────────────────────────────────────────────────────
  publish-release:
    name: Publish release (undraft)
    needs: [resolve-tag, publish-update-manifest]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `actions/checkout` in this job → set repo context for `gh`.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
