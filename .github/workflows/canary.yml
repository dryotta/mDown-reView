name: Canary Build

# Push-to-main canary release. Delegates build + signing + verification to
# ci.yml via workflow_call. Wrapper handles version-patching the source
# tree, creating immutable per-build canary releases, asset rename +
# upload, and updater-manifest publish.
#
# The "latest canary" pointer is hosted as a tracked file at
# `site/canary-latest.json` (deployed by pages.yml) rather than as a
# mutable `canary` release/tag — the mutable-pointer pattern is
# incompatible with GitHub's Release Immutability feature, which
# permanently reserves the tag-name of any release it ever protects.
# Every canary tag below is unique-per-build and never moved.
#
# Recovery contract: if the Pages-hosted manifest is ever unreachable,
# canary users can switch to the Stable channel in the About dialog,
# pick up the next stable release (which always has a working
# CANARY_ENDPOINT baked in), then switch back to Canary. See
# `docs/features/updates.md`.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '*.md'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  # Named static group so canary publishes serialize. Never cancel an
  # in-progress canary — half-published canary releases would point at
  # missing assets, breaking auto-update for every canary client.
  group: canary-publish
  cancel-in-progress: false

jobs:
  # ── Compute canary version + patch source tree ──────────────────────────
  prepare:
    name: Prepare canary version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      patched_branch: ${{ steps.patch.outputs.branch }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canary version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-${GITHUB_RUN_NUMBER}"
          # Tag schema: canary-{YYYYMMDDHHMMSS}-{run}-{shortsha}
          # Unique per build (no name reservation risk under Release
          # Immutability), lex-sortable, traceable to commit. See header
          # comment + docs/features/updates.md for the rationale.
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="canary-${TIMESTAMP}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Canary version: ${VERSION} (tag: ${TAG})"

      - name: Patch version into source tree + push branch
        id: patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.env.VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          BRANCH="canary-build/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(canary): patch version to ${VERSION}"
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  # ── Delegate build + verify to ci.yml ───────────────────────────────────
  ci:
    name: CI (signed, release profile)
    needs: prepare
    # `ci-gate-inputs` inside ci.yml declares per-job `actions: read` +
    # `pull-requests: read` (needed only on push-to-main for the squash-merge
    # tree-hash skip path). When ci.yml is invoked via workflow_call, the
    # called workflow's per-job permissions cannot exceed those of the
    # calling job — so we must grant these scopes here even though the skip
    # path is a no-op on workflow_call. Omitting this caused canary runs
    # after PR #386 to fail with `startup_failure` (zero jobs spawned) before
    # the `prepare` job's commit could be tested.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.patched_branch }}
      profile: release
      sign: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # ── Create immutable canary-N release + upload assets ───────────────────
  publish-canary-release:
    name: Publish canary-${{ github.run_number }}
    needs: [prepare, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts/

      - name: Create canary release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          NAME="mdownreview-${VERSION}"
          # Create as draft so subsequent `gh release upload` calls succeed
          # under "Enable release immutability" — published releases reject
          # asset uploads (HTTP 422). The release is undrafted in a follow-up
          # step after every asset is verified present, mirroring release.yml.
          gh release view "$TAG" &>/dev/null || \
          gh release create "$TAG" \
            --draft \
            --prerelease \
            --title "Canary Build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Canary build from main at \`${GITHUB_SHA::7}\`."
          for plat in windows-x64 windows-arm64 macos-arm64; do
            base="${NAME}-${plat}"
            indir="artefacts/${plat}"
            [ -d "$indir" ] || { echo "::error::Missing artefact dir for $plat"; exit 1; }
            case "$plat" in
              windows-*)
                cp "${indir}/mdownreview-${plat}.zip" "${base}.zip"
                gh release upload "$TAG" "${base}.zip" --clobber
                if [ -s "${indir}/mdownreview-${plat}.zip.sig" ]; then
                  cp "${indir}/mdownreview-${plat}.zip.sig" "${base}.zip.sig"
                  gh release upload "$TAG" "${base}.zip.sig" --clobber
                else
                  echo "::error::Missing .sig for $plat"; exit 1
                fi
                ;;
              macos-*)
                cp "${indir}/mdownreview-${plat}.dmg" "${base}.dmg"
                gh release upload "$TAG" "${base}.dmg" --clobber
                cp "${indir}/mdownreview-${plat}.app.tar.gz" "${base}.app.tar.gz"
                gh release upload "$TAG" "${base}.app.tar.gz" --clobber
                if [ -s "${indir}/mdownreview-${plat}.app.tar.gz.sig" ]; then
                  cp "${indir}/mdownreview-${plat}.app.tar.gz.sig" "${base}.app.tar.gz.sig"
                  gh release upload "$TAG" "${base}.app.tar.gz.sig" --clobber
                else
                  echo "::error::Missing .sig for $plat updater"; exit 1
                fi
                ;;
            esac
          done
          # Undraft only after every asset is uploaded — required by
          # "Enable release immutability" (published releases reject further
          # uploads). Matches the draft → upload → undraft pattern in
          # release.yml.
          gh release edit "$TAG" --draft=false

  # ── Publish canary-latest.json via GitHub Pages ─────────────────────────
  # Deploys site/ + freshly generated canary-latest.json directly to Pages.
  # This job does NOT commit to main — branch protection blocks bot pushes,
  # and a manifest-only commit would not pass through the required CI gate
  # check anyway.
  #
  # Coordination with pages.yml (which redeploys site/ on docs changes):
  # both workflows share the `pages` concurrency group and pages.yml has a
  # "Preserve current canary-latest.json" step that fetches the existing
  # manifest from the live Pages URL before deploying. The live Pages
  # deployment is therefore the single source of truth for the canary
  # manifest, kept alive by both workflows.
  publish-canary-manifest:
    name: Publish canary manifest
    needs: [prepare, publish-canary-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # The `pages` group serialises with pages.yml so canary-manifest deploys
    # and docs-site deploys never race. Never cancel — half-deployed Pages
    # are user-visible.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build canary-latest.json into site/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          BASE_URL="https://github.com/dryotta/mdownreview/releases/download/${TAG}"
          NAME="mdownreview-${VERSION}"
          mkdir -p /tmp/sigs
          read_sig() {
            local asset_name="$1"
            gh release download "$TAG" --pattern "${asset_name}" --dir /tmp/sigs 2>/dev/null || true
            local content
            content=$(cat "/tmp/sigs/${asset_name}" 2>/dev/null || echo "")
            if [ -z "$content" ]; then
              echo "::error::Missing or empty signature: $asset_name"
              return 1
            fi
            echo "$content"
          }
          for asset in "${NAME}-windows-x64.zip" "${NAME}-windows-arm64.zip" "${NAME}-macos-arm64.app.tar.gz"; do
            gh release view "$TAG" --json assets --jq ".assets[].name" | grep -q "^${asset}$" || \
              { echo "::error::Required updater asset not found: $asset"; exit 1; }
          done
          WIN_X64_SIG=$(read_sig "${NAME}-windows-x64.zip.sig")
          WIN_ARM64_SIG=$(read_sig "${NAME}-windows-arm64.zip.sig")
          MAC_ARM64_SIG=$(read_sig "${NAME}-macos-arm64.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p site
          cat > site/canary-latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Canary build from main (${GITHUB_SHA::7})",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_X64_SIG}",
                "url": "${BASE_URL}/${NAME}-windows-x64.zip"
              },
              "windows-aarch64": {
                "signature": "${WIN_ARM64_SIG}",
                "url": "${BASE_URL}/${NAME}-windows-arm64.zip"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM64_SIG}",
                "url": "${BASE_URL}/${NAME}-macos-arm64.app.tar.gz"
              }
            }
          }
          EOF
          echo "Generated canary-latest.json for ${VERSION}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Clean up old canary releases (separate job so it always runs) ───────
  cleanup-canary-releases:
    name: Clean up old canary releases
    needs: [prepare, publish-canary-manifest]
    if: always() && needs.publish-canary-manifest.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete old canary-{TIMESTAMP}-{run}-{sha} releases (keep last 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # New tag schema: canary-{YYYYMMDDHHMMSS}-{run}-{shortsha}
          # Filter strictly so legacy `canary-{N}` releases left over from
          # the pre-redesign era are not deleted by this job — clean those
          # up manually (or wait for repo-wide retention review).
          RELEASES=$(gh release list --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^canary-[0-9]{14}-[0-9]+-[0-9a-f]{7}$"))] | sort_by(.createdAt) | .[].tagName')
          COUNT=$(echo "$RELEASES" | grep -c . || true)
          KEEP=10
          if [ "$COUNT" -gt "$KEEP" ]; then
            DELETE_COUNT=$((COUNT - KEEP))
            echo "Cleaning up ${DELETE_COUNT} old canary releases (keeping last ${KEEP})"
            echo "$RELEASES" | head -n "$DELETE_COUNT" | while read -r tag; do
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
          else
            echo "Only ${COUNT} canary releases in new schema, nothing to clean up"
          fi

  # ── Clean up the patched-version branch ─────────────────────────────────
  cleanup:
    name: Clean up patched branch
    needs: [prepare, publish-canary-manifest]
    # Run even if downstream jobs fail, so long as prepare succeeded — the
    # patched branch is harmless but accumulates noise if not cleaned up.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete patched branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.patched_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1 && \
              git push origin --delete "$BRANCH" || echo "Branch $BRANCH already gone."
          fi
