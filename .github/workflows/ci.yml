name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'eslint.config.*'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust tests (Linux) ───────────────────────────────────────────────────
  # Runs in parallel with vitest, e2e-browser, and the build matrix.
  rust-test:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only the main branch publishes the cache; PR jobs restore-only.
          # Saves ~2m of post-job cache packing per PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Stage CLI binary (needed by integration tests + Tauri externalBin)
        run: npm run stage:cli

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::dbg_macro -D clippy::todo

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # ── Vitest unit tests (Linux) ────────────────────────────────────────────
  # No Rust, no apt deps needed — vitest runs under jsdom.
  vitest:
    name: Vitest (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: ESLint (typed)
        run: npm run lint:typed

      - name: Vitest unit tests
        run: npm test

      - name: Lint skill docs (npm-script references)
        run: npm run lint:skills

      - name: Audit zoom cascade
        run: npm run audit:zoom-cascade

      - name: Build frontend bundle
        run: npm run build

      - name: Check JS bundle size (gzipped, 3 MB starter / 2 MB target)
        run: node scripts/check-bundle-size.mjs

  # ── Playwright E2E (browser mode, Linux) ─────────────────────────────────
  e2e-browser:
    name: E2E browser (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright E2E tests (browser mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Bindings drift check (#263) ──────────────────────────────────────────
  # Regenerates `src/lib/bindings.ts` via the codegen test and asserts no
  # diff against the committed copy. Fails the PR if the Rust IPC surface
  # (commands or wire types) has drifted from `bindings.ts`. Uses the same
  # Linux apt deps as `rust-test` because `tests/specta_codegen.rs` links
  # against `mdown_review_lib::build_specta_builder` which pulls
  # `tauri::Wry` and `tauri-runtime-wry`.
  bindings-drift:
    name: Bindings drift check (#263)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only the main branch publishes the cache; PR jobs restore-only.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Distinct cache key so the test build (incl. dev-deps like
          # `specta-typescript`) does not evict the production rust-test
          # artefacts.
          prefix-key: bindings-drift

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Regenerate bindings.ts
        working-directory: src-tauri
        run: cargo test --features codegen --test specta_codegen generate_bindings_ts

      - name: Assert bindings.ts is up-to-date
        run: |
          if ! git diff --exit-code src/lib/bindings.ts; then
            echo "::error::bindings.ts is out of date. Regenerate with:"
            echo "::error::  cd src-tauri && cargo test --features codegen --test specta_codegen generate_bindings_ts"
            echo "::error::Then commit the result."
            exit 1
          fi

  # ── Aggregate test gate (satisfies branch-protection rule) ──────────────
  # Branch protection requires a check called "Test (Linux)".
  # This no-op job depends on every Linux test job so the gate stays green.
  test-gate:
    name: Test (Linux)
    if: always()
    needs: [rust-test, vitest, e2e-browser, bindings-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.rust-test.result }}" != "success" || \
                "${{ needs.vitest.result }}" != "success" || \
                "${{ needs.e2e-browser.result }}" != "success" || \
                "${{ needs.bindings-drift.result }}" != "success" ]]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi

  # ── Installer builds (Windows x64 + macOS) ──────────────────────────────
  # Runs in parallel with tests. Windows ARM64 build is in release-gate only
  # (cross-compilation takes ~8m; not needed for every PR).
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust_target: x86_64-pc-windows-msvc
            target_dir: src-tauri/target/release
            tauri_args: ""
            artifact_ext: zip

          - os: macos-latest
            name: macos-arm64
            rust_target: aarch64-apple-darwin
            target_dir: src-tauri/target/release
            tauri_args: ""
            artifact_ext: dmg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only the main branch publishes the cache; PR jobs restore-only.
          # Saves ~2m of post-job cache packing per PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Clean stale bundles from cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle 2>/dev/null || true

      - name: Build Tauri app
        shell: bash
        run: |
          # Retry to absorb the well-known macOS bundle_dmg.sh / hdiutil /
          # AppleScript flakiness (tauri-apps/tauri#3055, electron-builder#3115).
          # Linux + Windows builds rarely flake but the wrapper is harmless.
          attempt=1
          max_attempts=2
          while [ $attempt -le $max_attempts ]; do
            echo "::group::Build attempt $attempt of $max_attempts"
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Pre-attempt hygiene: reset Finder, detach any orphan disk
              # images, and remove half-written DMG output from a prior
              # failed attempt (bundle_dmg.sh refuses to overwrite).
              killall Finder 2>/dev/null || true
              hdiutil info | awk '/image-path/ {print $NF}' | while read -r p; do
                hdiutil detach "$p" -force 2>/dev/null || true
              done
              rm -rf src-tauri/target/release/bundle/dmg src-tauri/target/*/release/bundle/dmg 2>/dev/null || true
            fi
            if [ -n "${{ matrix.tauri_args }}" ]; then
              npm run tauri:build -- ${{ matrix.tauri_args }} && { echo "::endgroup::"; exit 0; }
            else
              npm run tauri:build && { echo "::endgroup::"; exit 0; }
            fi
            echo "::warning::Build attempt $attempt failed"
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done
          echo "::error::All $max_attempts build attempts failed"
          exit 1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build CLI binary
        shell: bash
        run: cargo build --release --bin mdownreview-cli --manifest-path src-tauri/Cargo.toml

      - name: Package artifact
        shell: bash
        run: |
          NAME="mdownreview-${{ matrix.name }}"
          if [[ "${{ matrix.artifact_ext }}" == "zip" ]]; then
            nsis_zip=$(ls -t ${{ matrix.target_dir }}/bundle/nsis/*.nsis.zip 2>/dev/null | head -1)
            [ -z "$nsis_zip" ] && { echo "::error::NSIS zip not found"; exit 1; }
            cp "$nsis_zip" "${NAME}.zip"
            echo "ARTIFACT=${NAME}.zip" >> "$GITHUB_ENV"
          else
            dmg=$(ls -t ${{ matrix.target_dir }}/bundle/dmg/*.dmg 2>/dev/null | head -1)
            [ -z "$dmg" ] && { echo "::error::DMG not found"; exit 1; }
            cp "$dmg" "${NAME}.dmg"
            echo "ARTIFACT=${NAME}.dmg" >> "$GITHUB_ENV"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 14
