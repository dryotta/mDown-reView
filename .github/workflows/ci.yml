name: CI

# Single converged workflow gating every PR to main + reused by canary/release.
#
# Triggers:
#   - pull_request: PR validation (no signing, no secrets, fast profile).
#   - push to main: post-merge sanity (no signing, no secrets).
#   - workflow_call: invoked by canary.yml and release.yml with sign=true and
#     profile=release to produce signed updater artefacts.
#
# Branch-protection contract: the aggregate gate `CI gate` is the single
# required check. It runs on EVERY PR (no path filter) so the gate always
# reports a status — docs-only PRs see all heavy jobs skipped via the
# `changes` job's `code` output, and the gate accepts skip-on-skip.
#
# Parallelism: every heavy job runs in parallel under `needs: changes`.
# `installer-e2e` is the only job with a further `needs:` edge (on `build`)
# because it consumes the windows-x64 installer artefact. Critical path is
# bounded by the slowest of {build matrix, native-e2e}.
#
# Jobs (all parallel under `changes` unless noted):
#   - lint-and-vitest (ubuntu)      — eslint, vitest, frontend build, bundle gates
#   - rust-test (ubuntu)             — clippy + cargo test (Linux)
#   - rust-test-windows (win-2022)   — clippy + cargo test (Windows-cfg code)
#   - rust-test-macos (macos-14)     — clippy + cargo test (macOS-cfg code)
#   - bench-compile-gate (ubuntu)    — `cargo bench --no-run --profile release-ci`
#                                      (parallel with rust-test; catches bench API drift)
#   - bench-report (ubuntu)          — runs benchmarks, compares against docs/performance.md
#                                      budgets, posts summary to job page. Non-blocking
#                                      (`continue-on-error: true`, not in test-gate).
#   - bindings-drift (ubuntu)
#   - e2e-browser (ubuntu)
#   - native-e2e (win-2022)          — CDP-attached Playwright
#   - build (matrix)                 — windows-x64, windows-arm64, macos-arm64
#   - installer-e2e (win-2022)       — NSIS install/uninstall against win-x64
#                                      build artefact (`needs: build`)
#   - release-preflight (ubuntu)     — only when sign=true
#   - test-gate (ubuntu, `CI gate`)  — aggregate; required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        description: Ref to checkout (release/canary callers pass this; PR/push leave empty).
      profile:
        type: string
        default: release-ci
        description: Cargo profile for build matrix. PR/push use `release-ci` (fast, no LTO). canary/release callers pass `release` for production-quality output.
      sign:
        type: boolean
        default: false
        description: Whether to sign artefacts and emit `.sig` files. canary/release callers pass `true`. PR/push are always unsigned.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  # Per-PR group cancels stale runs on push; per-ref group on push to main and
  # workflow_call lets each named release/canary version build to completion.
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Changes — compute whether anything outside docs/agent-config changed.
  # ─────────────────────────────────────────────────────────────────────────
  # Docs-only PRs (no source code touched) skip every heavy job and the
  # aggregate gate accepts skip-on-skip. Code PRs run the full matrix.
  # On push to main and workflow_call we always run the full matrix
  # because canary/release need every artefact regardless of what changed.
  changes:
    name: Compute changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Non-PR trigger — running full matrix."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          CODE=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              docs/*|.claude/*|site/*) ;;
              *.md) ;;
              *) CODE=true ;;
            esac
          done <<< "$CHANGED"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Heavy jobs will run: $CODE"

  # ─────────────────────────────────────────────────────────────────────────
  # Lint + Vitest + frontend build + bundle-size gates (Linux).
  # ─────────────────────────────────────────────────────────────────────────
  lint-and-vitest:
    name: Lint + Vitest (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: ESLint (typed)
        run: npm run lint:typed

      - name: Lint skill docs (npm-script references)
        run: npm run lint:skills

      - name: Vitest unit tests
        run: npm test

      - name: Audit zoom cascade
        run: npm run audit:zoom-cascade

      - name: Build frontend bundle
        run: npm run build

      - name: Check JS bundle size (gzipped)
        run: node scripts/check-bundle-size.mjs

      - name: Check main entry bundle baseline (within ±5%)
        run: node scripts/check-bundle-baseline.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # Clippy + Rust tests (Linux). Combined into one job so the cargo cache
  # warms once for both phases (~2 min saved vs splitting).
  # ─────────────────────────────────────────────────────────────────────────
  rust-test:
    name: Rust tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Stage CLI binary (needed by Tauri externalBin during cargo test)
        run: npm run stage:cli

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::dbg_macro -D clippy::todo

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # ─────────────────────────────────────────────────────────────────────────
  # Bench compile gate (Linux). Separate parallel job so the bench compile
  # (release profile, 6 criterion binaries) does not block the rust-test
  # critical path.
  #
  # Uses --profile release-ci (lto=off, codegen-units=16) rather than the
  # default bench/release profile (lto=thin, codegen-units=1) — captures
  # the same API-drift signal at ~5× lower compile cost.
  #
  # `cargo bench --no-run` compiles benches/ but skips execution; it is the
  # only cargo invocation that compiles bench harnesses (cargo test does not).
  # ─────────────────────────────────────────────────────────────────────────
  bench-compile-gate:
    name: Bench compile gate (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Distinct prefix-key so the release-ci bench cache does not evict
          # the test-profile cache used by rust-test.
          prefix-key: bench-compile-gate

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Compile-gate benches (cargo bench --no-run)
        # Catches bench code rot. `cargo test` does NOT compile benches/;
        # only `cargo bench` (or `--all-targets`) does. Running with
        # `--no-run` skips execution while still catching API drift in
        # `benches/{matching,scanner,sidecar,threads,parsers,hot_path}.rs`
        # and `benches/generate_fixtures.rs`.
        # `--profile release-ci` uses lto=off + codegen-units=16 (vs the
        # default bench profile which inherits lto=thin + codegen-units=1
        # from [profile.release]), cutting compile time ~5×.
        working-directory: src-tauri
        run: cargo bench --no-run --profile release-ci

  # ─────────────────────────────────────────────────────────────────────────
  # Perf bench report (Linux, non-blocking).
  #
  # Generates bench fixtures, runs all criterion benchmarks with
  # `--output-format bencher`, then parses the output against the numeric
  # budgets declared in docs/performance.md and writes a markdown pass/fail
  # table to the job summary page (visible on the PR checks tab). Raw bench
  # output is uploaded as a 14-day artifact for trend inspection.
  #
  # `continue-on-error: true` + absent from `test-gate` → purely advisory.
  # A slow bench or fixture-gen failure never blocks a merge.
  #
  # Budgets (release-ci profile — lto=off, codegen-units=16):
  #   hot_path/get_file_comments_large          < 20 ms
  #   matching/50_comments_1000_lines           <  5 ms
  #   fold_regions/large_100kb_jsonlike/default <  5 ms
  #   parse_kql/pipeline_50_steps               <  1 ms
  #   strip_json_comments/large_100kb           <  3 ms
  # ─────────────────────────────────────────────────────────────────────────
  bench-report:
    name: Perf bench report (non-blocking)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Distinct prefix-key so the bench-report release-ci cache does not
          # evict the test-profile cache used by rust-test or the compile-only
          # cache used by bench-compile-gate.
          prefix-key: bench-report

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Generate bench fixtures
        # Populates target/bench-fixtures/ (gitignored) used by matching_bench,
        # hot_path_bench, sidecar_bench, and scanner_bench. Must run before
        # `cargo bench` so fixture-dependent benches don't panic/skip.
        working-directory: src-tauri
        run: cargo run --example generate_bench_fixtures --profile release-ci

      - name: Run benchmarks
        working-directory: src-tauri
        run: |
          cargo bench --profile release-ci -- --output-format bencher 2>&1 \
            | tee ../bench-output.txt

      - name: Write perf summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Perf Bench Report"
            echo ""
            echo "Profile: \`release-ci\` (lto=off, codegen-units=16 — expect ~1.5–2× slower than production \`release\`)"
            echo ""
            echo "| Bench | Measured | Budget | Status |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Budgets in nanoseconds — mirrors docs/performance.md.
          declare -A BUDGETS=(
            ["hot_path/get_file_comments_large"]=20000000
            ["matching/50_comments_1000_lines"]=5000000
            ["fold_regions/large_100kb_jsonlike/default"]=5000000
            ["parse_kql/pipeline_50_steps"]=1000000
            ["strip_json_comments/large_100kb"]=3000000
          )
          declare -A BUDGET_LABELS=(
            ["hot_path/get_file_comments_large"]="20 ms"
            ["matching/50_comments_1000_lines"]="5 ms"
            ["fold_regions/large_100kb_jsonlike/default"]="5 ms"
            ["parse_kql/pipeline_50_steps"]="1 ms"
            ["strip_json_comments/large_100kb"]="3 ms"
          )

          fmt_ns() {
            local ns=$1
            if [ "$ns" -ge 1000000 ]; then
              awk "BEGIN { printf \"%.2f ms\", $ns/1000000 }"
            elif [ "$ns" -ge 1000 ]; then
              awk "BEGIN { printf \"%.2f us\", $ns/1000 }"
            else
              echo "${ns} ns"
            fi
          }

          # Parse bencher output: "test <name> ... bench:   N,NNN ns/iter (+/- M)"
          while IFS= read -r line; do
            if [[ "$line" =~ ^test[[:space:]](.+)[[:space:]]...[[:space:]]bench:[[:space:]]+([0-9,]+)[[:space:]]ns/iter ]]; then
              name="${BASH_REMATCH[1]}"
              ns=$(echo "${BASH_REMATCH[2]}" | tr -d ',')
              budget="${BUDGETS[$name]:-}"
              if [ -n "$budget" ]; then
                measured=$(fmt_ns "$ns")
                budget_label="${BUDGET_LABELS[$name]}"
                if [ "$ns" -le "$budget" ]; then
                  status="✅"
                else
                  status="⚠️ over budget"
                fi
                echo "| \`$name\` | $measured | $budget_label | $status |" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done < bench-output.txt

          {
            echo ""
            echo "<details><summary>Full bench output</summary>"
            echo ""
            echo '```'
            cat bench-output.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench-output.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Rust tests (Windows) — exercises `#[cfg(target_os = "windows")]` and
  # `#[cfg(windows)]` code paths that the Linux `rust-test` job cannot
  # compile. Includes tests in cli_shim/windows.rs, core/security/
  # system_locations_tests.rs (windows arms), core/paths_tests.rs (windows
  # arms), and registry.rs (windows arms).
  # ─────────────────────────────────────────────────────────────────────────
  rust-test-windows:
    name: Rust tests (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Distinct prefix-key — must not evict the matrix `build` cache
          # nor the bindings-drift cache.
          prefix-key: rust-test-windows

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Stage CLI binary (needed by Tauri externalBin during cargo test)
        run: npm run stage:cli

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::dbg_macro -D clippy::todo

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # ─────────────────────────────────────────────────────────────────────────
  # Rust tests (macOS) — exercises `#[cfg(target_os = "macos")]` code paths
  # that the Linux `rust-test` job cannot compile. Includes tests in
  # cli_shim/macos.rs, default_handler/macos arms, config/macos arms, and
  # the macOS RunEvent handlers in lib.rs.
  # ─────────────────────────────────────────────────────────────────────────
  rust-test-macos:
    name: Rust tests (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Match the release-build deployment target so cfg gates compile
      # against the same minimum macOS version as the shipped binary.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: rust-test-macos

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Stage CLI binary (needed by Tauri externalBin during cargo test)
        run: npm run stage:cli

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::dbg_macro -D clippy::todo

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # ─────────────────────────────────────────────────────────────────────────
  # Bindings drift check — separate prefix-key so codegen feature doesn't
  # evict production cache.
  # ─────────────────────────────────────────────────────────────────────────
  bindings-drift:
    name: Bindings drift check (#263)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: bindings-drift

      - name: Cache Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Stage CLI binary (needed by Tauri externalBin)
        run: npm run stage:cli

      - name: Regenerate bindings.ts
        working-directory: src-tauri
        run: cargo test --features codegen --test specta_codegen generate_bindings_ts

      - name: Assert bindings.ts is up-to-date
        run: |
          if ! git diff --exit-code src/lib/bindings.ts; then
            echo "::error::bindings.ts is out of date. Regenerate with:"
            echo "::error::  cd src-tauri && cargo test --features codegen --test specta_codegen generate_bindings_ts"
            echo "::error::Then commit the result."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Playwright browser-mode E2E (Linux, Vite dev server + IPC mock).
  # ─────────────────────────────────────────────────────────────────────────
  e2e-browser:
    name: E2E browser (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright E2E tests (browser mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Native E2E (Windows, debug binary + CDP-attached Playwright).
  # ─────────────────────────────────────────────────────────────────────────
  # `playwright.native.config.ts` enforces workers:1, fullyParallel:false —
  # specs share a single CDP-attached debug binary. Sharding deferred.
  native-e2e:
    name: Native E2E (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: native-e2e-debug

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Stage CLI binary (debug, needed by Tauri externalBin)
        run: npm run stage:cli

      - name: Build debug binary (for CDP native tests)
        working-directory: src-tauri
        run: cargo build

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-Windows-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Native E2E tests
        run: npm run test:e2e:native
        env:
          MDR_NATIVE_SKIP_INSTALLER: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-native-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Build matrix — windows-x64, windows-arm64, macos-arm64.
  # ─────────────────────────────────────────────────────────────────────────
  # PR / push: `profile: release-ci` (no LTO, no strip) — ~6-8 min.
  # canary / release callers: `profile: release` + `sign: true` — ~10-12 min.
  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # release gate is the last line of defense; we want full cross-platform
      # signal in one run rather than discovering a macOS failure on retry.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
            artifact_ext: zip
          - name: windows-arm64
            os: windows-2022
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc"
            artifact_ext: zip
          - name: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: ""
            artifact_ext: dmg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Distinct cache per target+profile so the release-ci PR cache
          # cannot evict the release production cache (and vice versa).
          prefix-key: build-${{ matrix.name }}-${{ inputs.profile || 'release-ci' }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve target dir for active profile
        id: paths
        shell: bash
        run: |
          PROFILE="${{ inputs.profile || 'release-ci' }}"
          if [ -n "${{ matrix.tauri_args }}" ]; then
            # `--target <triple>` causes cargo to put output under
            # target/<triple>/<profile>/ instead of target/<profile>/.
            TARGET_DIR="src-tauri/target/${{ matrix.rust_target }}/${PROFILE}"
          else
            TARGET_DIR="src-tauri/target/${PROFILE}"
          fi
          echo "target_dir=${TARGET_DIR}" >> "$GITHUB_OUTPUT"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "Resolved target_dir=${TARGET_DIR} profile=${PROFILE}"

      - name: Clean stale bundles from cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/release-ci/bundle src-tauri/target/*/release/bundle src-tauri/target/*/release-ci/bundle 2>/dev/null || true

      - name: Build frontend (so tauri::generate_context! can validate dist/ during pre-build)
        # The pre-build step below uses `--features tauri/custom-protocol`,
        # which makes `tauri::generate_context!` validate that `frontendDist`
        # (= `../dist`) exists at compile time. We must build the Vite bundle
        # before the cargo step, otherwise the proc-macro panics with
        # "frontendDist ... doesn't exist". `tauri build`'s
        # `beforeBuildCommand: "npm run build"` re-runs Vite during step 2,
        # which is fast (Vite is incremental and dist/ is already populated).
        shell: bash
        run: npm run build

      - name: Stage CLI binary + pre-build GUI bin (matches active profile)
        # The CLI sidecar is staged using the SAME Cargo profile as the GUI
        # build that runs next, so the dep graph is compiled once instead of
        # twice (Cargo cannot share artefacts between `release` and
        # `release-ci`). `--with-gui` makes this a `cargo build --bins
        # --features tauri/custom-protocol`, compiling both binaries in one
        # invocation that shares the dep + lib graph. The subsequent
        # `tauri build` step's cargo invocation then finds every fingerprint
        # fresh and skips straight to the bundler stage. STATIC_VCRUNTIME
        # is pre-set to `true` to match the env var tauri-cli unconditionally
        # exports, otherwise tauri-build's static-vcruntime link directives
        # would change between this step and `tauri build`, forcing a
        # link-only re-run on Windows MSVC.
        shell: bash
        env:
          STATIC_VCRUNTIME: "true"
        run: node scripts/stage-cli.mjs --profile "${{ steps.paths.outputs.profile }}" --target "${{ matrix.rust_target }}" --with-gui

      - name: Build Tauri app
        shell: bash
        env:
          STAGE_CLI_TARGET: ${{ matrix.rust_target }}
          # Match the env var pre-set above so tauri-build's link-arg
          # outputs are identical between the two cargo invocations.
          STATIC_VCRUNTIME: "true"
          # Signing keys flow only when caller sets sign=true. PR/push leave
          # them unset → Tauri produces unsigned bundles + no .sig files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          PROFILE="${{ steps.paths.outputs.profile }}"
          # When sign=false (PR/push) we must suppress updater artefact creation
          # — tauri.conf.json sets `createUpdaterArtifacts: "v1Compatible"` so
          # the bundler tries to sign with an empty key and aborts with
          # "failed to decode secret key". Passing a `--config` JSON patch
          # that flips the flag to `false` keeps PR builds unsigned without
          # touching the committed config.
          if [ "${{ inputs.sign }}" = "true" ]; then
            CONFIG_OVERRIDE=""
          else
            CONFIG_OVERRIDE='--config {"bundle":{"createUpdaterArtifacts":false}}'
          fi
          # Retry to absorb the well-known macOS bundle_dmg.sh / hdiutil /
          # AppleScript flakiness (tauri-apps/tauri#3055).
          attempt=1
          max_attempts=2
          while [ $attempt -le $max_attempts ]; do
            echo "::group::Build attempt $attempt of $max_attempts (profile=$PROFILE, sign=${{ inputs.sign }})"
            if [ "$RUNNER_OS" = "macOS" ]; then
              killall Finder 2>/dev/null || true
              hdiutil info | awk '/image-path/ {print $NF}' | while read -r p; do
                hdiutil detach "$p" -force 2>/dev/null || true
              done
              rm -rf "src-tauri/target/$PROFILE/bundle/dmg" src-tauri/target/*/"$PROFILE"/bundle/dmg 2>/dev/null || true
            fi
            # `tauri build` flags before `--`; cargo runner flags after `--`.
            if npx tauri build ${{ matrix.tauri_args }} $CONFIG_OVERRIDE -- --profile "$PROFILE"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed"
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done
          echo "::error::All $max_attempts build attempts failed"
          exit 1

      # ── Verification when sign=true ─────────────────────────────────────
      - name: Verify ad-hoc signing (macOS)
        if: runner.os == 'macOS' && inputs.sign == true
        shell: bash
        run: |
          APP_PATH=$(ls -d ${{ steps.paths.outputs.target_dir }}/bundle/macos/*.app 2>/dev/null | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app bundle found"; exit 1; }
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.log
          grep -q 'Signature=adhoc' codesign.log || { echo "::error::App is not ad-hoc signed"; exit 1; }
          codesign -dv --verbose=4 "$APP_PATH/Contents/MacOS/mdownreview-cli" 2>&1 | tee codesign-cli.log
          grep -q 'Signature=adhoc' codesign-cli.log || { echo "::error::Embedded CLI is not ad-hoc signed"; exit 1; }
          echo "✓ App and embedded CLI are ad-hoc signed"

      - name: Verify DMG layout (macOS)
        if: runner.os == 'macOS' && inputs.sign == true
        shell: bash
        run: |
          DMG=$(ls -t ${{ steps.paths.outputs.target_dir }}/bundle/dmg/*.dmg 2>/dev/null | head -1)
          [ -n "$DMG" ] || { echo "::error::No DMG found to verify"; exit 1; }
          DMG_ABS=$(cd "$(dirname "$DMG")" && pwd)/$(basename "$DMG")
          hdiutil info | awk -v target="$DMG_ABS" '
            BEGIN { path="" }
            /^=+$/ { path=""; next }
            $1 == "image-path" { sub(/^image-path[ \t]*:[ \t]*/, ""); path=$0; next }
            $1 ~ /^\/dev\/disk[0-9]+$/ && path == target { print $1 }
          ' | while IFS= read -r dev; do
            hdiutil detach "$dev" -force >/dev/null 2>&1 || true
          done
          if ! ATTACH_OUT=$(hdiutil attach -nobrowse -readonly "$DMG" 2>&1); then
            echo "::error::hdiutil attach failed"
            echo "$ATTACH_OUT"
            exit 1
          fi
          echo "$ATTACH_OUT"
          MOUNT=$(echo "$ATTACH_OUT" | awk 'match($0, /\/Volumes\/.*/) { print substr($0, RSTART); exit }')
          [ -n "$MOUNT" ] && [ -d "$MOUNT" ] || { echo "::error::Failed to mount DMG"; exit 1; }
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          ls -la "$MOUNT"
          [ -L "$MOUNT/Applications" ] || { echo "::error::Applications symlink missing in DMG"; exit 1; }
          echo "✓ DMG mounts cleanly and contains the Applications symlink"

      - name: Verify updater signature artefacts (Windows)
        if: runner.os == 'Windows' && inputs.sign == true
        shell: bash
        run: |
          nsis_zip=$(ls -t ${{ steps.paths.outputs.target_dir }}/bundle/nsis/*.nsis.zip 2>/dev/null | head -1)
          [ -n "$nsis_zip" ] || { echo "::error::No NSIS zip produced"; exit 1; }
          sig="${nsis_zip}.sig"
          [ -s "$sig" ] || { echo "::error::Updater signature missing or empty: $sig"; exit 1; }
          echo "✓ NSIS zip + signature present"

      - name: Verify updater signature artefacts (macOS)
        if: runner.os == 'macOS' && inputs.sign == true
        shell: bash
        run: |
          app_tar=$(ls -t ${{ steps.paths.outputs.target_dir }}/bundle/macos/*.app.tar.gz 2>/dev/null | head -1)
          [ -n "$app_tar" ] || { echo "::error::No .app.tar.gz updater bundle produced"; exit 1; }
          sig="${app_tar}.sig"
          [ -s "$sig" ] || { echo "::error::Updater signature missing or empty: $sig"; exit 1; }
          echo "✓ .app.tar.gz + signature present"

      # ── Artefact packaging + upload ──────────────────────────────────────
      # Bundle output depends on whether updater artefacts are produced:
      #   - sign=true  → Tauri produces `*.nsis.zip` (updater) + `*.app.tar.gz` (mac updater) + `.sig` files
      #   - sign=false → Tauri produces `*-setup.exe` (standard NSIS) + `.dmg` only (no updater)
      - name: Package artefact
        shell: bash
        run: |
          NAME="mdownreview-${{ matrix.name }}"
          TARGET_DIR="${{ steps.paths.outputs.target_dir }}"
          if [[ "${{ matrix.artifact_ext }}" == "zip" ]]; then
            if [ "${{ inputs.sign }}" = "true" ]; then
              # Updater artefact: `*.nsis.zip` (signed)
              nsis_zip=$(ls -t "$TARGET_DIR"/bundle/nsis/*.nsis.zip 2>/dev/null | head -1)
              [ -z "$nsis_zip" ] && { echo "::error::NSIS updater zip not found in $TARGET_DIR/bundle/nsis"; exit 1; }
              cp "$nsis_zip" "${NAME}.zip"
              if [ -s "${nsis_zip}.sig" ]; then
                cp "${nsis_zip}.sig" "${NAME}.zip.sig"
              fi
            else
              # Standard NSIS installer: `*-setup.exe` (unsigned PR build)
              setup_exe=$(ls -t "$TARGET_DIR"/bundle/nsis/*-setup.exe 2>/dev/null | head -1)
              [ -z "$setup_exe" ] && { echo "::error::NSIS installer not found in $TARGET_DIR/bundle/nsis"; exit 1; }
              cp "$setup_exe" "${NAME}.exe"
            fi
          else
            dmg=$(ls -t "$TARGET_DIR"/bundle/dmg/*.dmg 2>/dev/null | head -1)
            [ -z "$dmg" ] && { echo "::error::DMG not found in $TARGET_DIR/bundle/dmg"; exit 1; }
            cp "$dmg" "${NAME}.dmg"
            if [ "${{ inputs.sign }}" = "true" ]; then
              app_tar=$(ls -t "$TARGET_DIR"/bundle/macos/*.app.tar.gz 2>/dev/null | head -1)
              if [ -n "$app_tar" ]; then
                cp "$app_tar" "${NAME}.app.tar.gz"
                if [ -s "${app_tar}.sig" ]; then
                  cp "${app_tar}.sig" "${NAME}.app.tar.gz.sig"
                fi
              fi
            fi
          fi

      - name: Upload installer artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            mdownreview-${{ matrix.name }}.zip
            mdownreview-${{ matrix.name }}.zip.sig
            mdownreview-${{ matrix.name }}.exe
            mdownreview-${{ matrix.name }}.dmg
            mdownreview-${{ matrix.name }}.app.tar.gz
            mdownreview-${{ matrix.name }}.app.tar.gz.sig
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Installer E2E (Windows) — NSIS install/uninstall round-trip against the
  # build artefact produced by `build (windows-x64)`. Validates HKCU PATH
  # mutation + restoration, the `installer-hooks.nsh` PRE/POST logic, and
  # silent install/uninstall exit codes. Closes the gap where the spec
  # existed (`e2e/native/installer.spec.ts` + `playwright.installer.config.ts`)
  # but was never wired into CI.
  # ─────────────────────────────────────────────────────────────────────────
  # `needs: build` waits for the whole matrix, but in practice this job is
  # gated only on the windows-x64 leg's artefact. Runs in parallel with
  # `native-e2e`, `rust-test*`, etc.; only its execution waits.
  installer-e2e:
    name: Installer E2E (Windows)
    needs: [changes, build]
    # Only runs on PR / push (sign=false). On sign=true the build matrix
    # uploads a `.nsis.zip` updater bundle (no standalone setup.exe), so
    # installer-e2e has nothing to consume — release-preflight covers the
    # signed-artefact contract instead.
    if: needs.changes.outputs.code == 'true' && inputs.sign != true
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download windows-x64 build artefact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artefacts/windows-x64/

      - name: Resolve installer path
        id: installer
        shell: bash
        run: |
          set -e
          exe="artefacts/windows-x64/mdownreview-windows-x64.exe"
          if [ ! -s "$exe" ]; then
            echo "::error::Installer .exe missing or empty at $exe"
            exit 1
          fi
          abs=$(cygpath -w "$(pwd)/$exe" 2>/dev/null || echo "$(pwd)/$exe")
          echo "path=$abs" >> "$GITHUB_OUTPUT"
          echo "Resolved installer path: $abs"

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-Windows-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Installer E2E (NSIS round-trip)
        env:
          MDR_INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: npm run test:e2e:native:installer

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-installer-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Release preflight — only when sign=true (canary/release callers).
  # ─────────────────────────────────────────────────────────────────────────
  # Validates every updater asset the manifest will reference exists and is
  # non-empty BEFORE the wrapper workflow tries to publish. Closes the gap
  # where canary/release would push a manifest pointing at missing `.sig`
  # files (the High finding from `tauri-build-expert`).
  release-preflight:
    name: Release preflight
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && inputs.sign == true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts/

      - name: Assert every updater asset is present
        shell: bash
        run: |
          set -e
          missing=0
          required=(
            "windows-x64/mdownreview-windows-x64.zip"
            "windows-x64/mdownreview-windows-x64.zip.sig"
            "windows-arm64/mdownreview-windows-arm64.zip"
            "windows-arm64/mdownreview-windows-arm64.zip.sig"
            "macos-arm64/mdownreview-macos-arm64.dmg"
            "macos-arm64/mdownreview-macos-arm64.app.tar.gz"
            "macos-arm64/mdownreview-macos-arm64.app.tar.gz.sig"
          )
          for asset in "${required[@]}"; do
            path="artefacts/$asset"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty updater asset: $path"
              missing=$((missing + 1))
            else
              size=$(stat -c%s "$path" 2>/dev/null || stat -f%z "$path")
              echo "✓ $asset ($size bytes)"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing updater asset(s) missing — release/canary would publish a broken manifest."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Aggregate gate — REQUIRED by branch protection as `CI gate`.
  # ─────────────────────────────────────────────────────────────────────────
  # Always runs (`if: always()`). For docs-only PRs every heavy job is
  # skipped → the gate accepts skip-on-skip. For code PRs every heavy job
  # must succeed. `release-preflight` is required only when sign=true.
  # `installer-e2e` is required only when sign != true (canary/release skip
  # it because the build matrix emits a `.zip` updater bundle, not a setup
  # `.exe` — release-preflight covers the signed-artefact contract).
  test-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - lint-and-vitest
      - rust-test
      - rust-test-windows
      - rust-test-macos
      - bench-compile-gate
      - bindings-drift
      - e2e-browser
      - native-e2e
      - build
      - installer-e2e
      - release-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || {
            echo "::error::changes job did not succeed (got ${{ needs.changes.result }})"
            exit 1
          }
          CODE="${{ needs.changes.outputs.code }}"
          echo "code_changed=$CODE"
          if [ "$CODE" != "true" ]; then
            echo "Docs-only PR — heavy jobs correctly skipped. Gate green."
            exit 0
          fi
          jobs=(
            "lint-and-vitest:${{ needs.lint-and-vitest.result }}"
            "rust-test:${{ needs.rust-test.result }}"
            "rust-test-windows:${{ needs.rust-test-windows.result }}"
            "rust-test-macos:${{ needs.rust-test-macos.result }}"
            "bench-compile-gate:${{ needs.bench-compile-gate.result }}"
            "bindings-drift:${{ needs.bindings-drift.result }}"
            "e2e-browser:${{ needs.e2e-browser.result }}"
            "native-e2e:${{ needs.native-e2e.result }}"
            "build:${{ needs.build.result }}"
          )
          if [ "${{ inputs.sign }}" = "true" ]; then
            jobs+=("release-preflight:${{ needs.release-preflight.result }}")
          else
            jobs+=("installer-e2e:${{ needs.installer-e2e.result }}")
          fi
          failed=0
          for entry in "${jobs[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (got $result)"
              failed=$((failed + 1))
            else
              echo "✓ $name: $result"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed job(s) failed — gate red."
            exit 1
          fi
          echo "All required jobs succeeded — gate green."
