[package]
name = "mdownreview"
version = "0.3.4"
description = "A desktop markdown reviewer for developers"
license = "MIT"
authors = ["davidzh"]
edition = "2021"
default-run = "mdownreview"
autobenches = false

[lib]
name = "mdown_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mdownreview-cli"
path = "src/bin/cli.rs"

[[example]]
name = "generate_bench_fixtures"
path = "benches/generate_fixtures.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "7"
notify-debouncer-mini = "0.5"
walkdir = "2"
ignore = "0.4"
serde-saphyr = "=0.0.25"
saphyr = "=0.0.6"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
unicode-segmentation = "1"
# Pure-Rust path canonicalizer that strips Windows `\\?\` verbatim prefixes
# whenever an equivalent non-verbatim form exists. Promoted from transitive
# (tauri/open) to direct so `core::paths::canonicalize_no_verbatim` has a
# stable, intentional dependency. See docs/security.md rule 11.
dunce = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
tempfile = "3"
serde-saphyr = "=0.0.25"
serde_json = "1"
rand = "0.8"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints.clippy]
# Deny — CI-blocking, never allow in production
dbg_macro = "deny"
todo = "deny"

# Warn — advisory, not CI-blocking (use #[allow] for legitimate exceptions)
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
manual_string_new = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
cast_lossless = "warn"
redundant_closure_for_method_calls = "warn"
implicit_clone = "warn"

[lints.rust]
unsafe_code = "warn"

[[bench]]
name = "sidecar_bench"
harness = false

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "threads_bench"
harness = false

[[bench]]
name = "hot_path_bench"
harness = false

[[bench]]
name = "parsers_bench"
harness = false
