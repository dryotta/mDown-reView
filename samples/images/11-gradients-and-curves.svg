<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="abstract waveform with gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#bg)"/>
  <!-- Three sine waves at different phases -->
  <path d="M0 160 Q 60 60, 120 160 T 240 160 T 360 160 T 480 160" stroke="url(#wave)" stroke-width="6" fill="none"/>
  <path d="M0 200 Q 60 100, 120 200 T 240 200 T 360 200 T 480 200" stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M0 240 Q 60 140, 120 240 T 240 240 T 360 240 T 480 240" stroke="#f472b6" stroke-width="3" fill="none" opacity="0.5"/>
  <text x="20" y="40" font-family="ui-monospace, monospace" font-size="20" fill="#94a3b8">11-svg-with-gradients-and-curves</text>
</svg>
