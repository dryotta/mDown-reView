<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="quarterly bar chart">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 12px; fill: #1f2937; }
    .axis { stroke: #6b7280; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2 3; }
    .bar  { fill: #2563eb; }
    .label { font-size: 11px; fill: #374151; text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; }
  </style>
  <text x="180" y="20" text-anchor="middle" class="title">Quarterly throughput (PRs merged)</text>
  <line x1="50" y1="180" x2="340" y2="180" class="axis"/>
  <line x1="50" y1="40"  x2="340" y2="40"  class="grid"/>
  <line x1="50" y1="80"  x2="340" y2="80"  class="grid"/>
  <line x1="50" y1="120" x2="340" y2="120" class="grid"/>
  <text x="44" y="184" text-anchor="end">0</text>
  <text x="44" y="124" text-anchor="end">25</text>
  <text x="44" y="84"  text-anchor="end">50</text>
  <text x="44" y="44"  text-anchor="end">75</text>
  <rect class="bar" x="80"  y="120" width="40" height="60"/>
  <rect class="bar" x="140" y="90"  width="40" height="90"/>
  <rect class="bar" x="200" y="60"  width="40" height="120"/>
  <rect class="bar" x="260" y="48"  width="40" height="132"/>
  <text class="label" x="100" y="200">Q1</text>
  <text class="label" x="160" y="200">Q2</text>
  <text class="label" x="220" y="200">Q3</text>
  <text class="label" x="280" y="200">Q4</text>
</svg>
