# Fixture lock — issue #352 / iter-22 (retro §6, §8 P2)
#
# SHA-256 manifest of every shipped Excalidraw fixture in this directory.
# The `samples/excalidraw/__tests__/fixtures.test.ts` test asserts each
# file's hash matches this manifest. Catches the iter-21 P0-1 regression
# class structurally: any code path that silently mutates a fixture during
# CI (e.g. an autosave-loop bug that wipes 226 → 6 lines) would change
# the SHA and fail the gate at the iter the bug is introduced.
#
# Update this file when intentionally regenerating a fixture (and only
# then). Format: `<sha256>  <filename>` (two-space separator, mirrors
# the `sha256sum` output convention).
#
# Line endings: SHAs are computed against the LF-normalized fixtures.
# `.gitattributes` pins these files to `text eol=lf` so the working
# tree is LF on every platform; otherwise CRLF on Windows would
# desynchronise the local hash from the Linux-CI hash.
